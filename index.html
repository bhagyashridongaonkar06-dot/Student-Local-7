<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Local 7</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <h1 class="bg-warning text-white text-center p-2">Student With local Storage 7</h1>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-5 mt-5">

                <div class="card">
                    <form action="" id="courseForm">
                        <h3 class="bg-info text-white text-center p-2">Courses Form</h3>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="name">Enter Name:</label>
                                        <input type="text" class="form-control" id="name">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="duration">Enter duration:</label>
                                        <input type="text" class="form-control" id="duration">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="fees">Enter fees:</label>
                                        <input type="number" class="form-control" id="fees">
                                    </div>
                                </div>



                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="mode">Enter mode:</label>
                                        <select class="form-control" id="mode">
                                            <option value="Offline">Offline</option>
                                            <option value="Online">Online</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-info btn-block btn-sm" id="addCourseBtn">Add
                                Course</button>
                            <button type="button" class="btn btn-warning btn-block btn-sm d-none" id="updateCourseBtn">Update
                                Course</button>

                        </div>
                    </form>
                </div>
            </div>


            <div class="col-md-7 mt-5">
                <div class="card">
                    <div class="card-body table-responsive">
                        <table class="table table-bordered">
                            <thead class="bg-info">
                                <tr>
                                    <th>Sr No</th>
                                    <th>Name</th>
                                    <th>Duration</th>
                                    <th>Fees</th>
                                    <th>Mode</th>
                                    <th>Edit</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>

                            <tbody id="coursesList">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>1</td>
                                    <td>1</td>
                                    <td><span class="badge badge-warning p-2 forbadge">offline</span></td>
                                    <td>1</td>
                                    <td><i class="fa-regular fa-2x fa-pen-to-square text-success"></i></td>
                                    <td><i class="fa-regular fa-2x fa-trash-can text-danger"></i></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
